name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: flutter build apk --debug
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build-debug.log

      - name: flutter build apk --release
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-release.log

      - uses: actions/upload-artifact@v4
        with:
          name: bondoolai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bondoolai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Post build log tail as commit comment on failure
        if: failure()
        run: |
          {
            echo "### Build failure diagnostics"
            echo '```'
            tail -c 55000 build-debug.log build-release.log 2>/dev/null
            echo '```'
          } > comment-body.txt
          python3 .github/scripts/post_failure_comment.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
