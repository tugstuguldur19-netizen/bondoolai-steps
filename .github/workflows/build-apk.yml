name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: flutter build apk --release
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build-release.log
          cp build/app/outputs/flutter-apk/app-release.apk bondoolai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bondoolai-apk
          path: bondoolai.apk

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Бондоолой — build ${{ github.run_number }}
          body: |
            Утсан дээрээ bondoolai.apk файлыг татаж аваад суулгана уу.
            (Download bondoolai.apk on your Android phone and open it to install.)
          files: bondoolai.apk
          make_latest: true

      - name: Emit build log tail as error annotations on failure
        if: failure()
        run: python3 .github/scripts/emit_error_annotations.py
