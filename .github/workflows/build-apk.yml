name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: flutter build apk --debug
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build-debug.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bondoolai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

      - name: flutter build apk --release
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-release.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bondoolai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore

      - name: Emit build log tail as error annotations on failure
        if: failure()
        run: python3 .github/scripts/emit_error_annotations.py
